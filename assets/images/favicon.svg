<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="DailyLingo">
  <title>DailyLingo</title>
  <!-- 圆角方底：与站点强调色同族 -->
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7cc9"/>
      <stop offset="1" stop-color="#24507f"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#dl-bg)"/>
  <!-- 声波：三条渐高竖条，表示「朗读」 -->
  <g fill="#cfe2f8">
    <rect x="30.5" y="23" width="10" height="15" rx="5"/>
    <rect x="45" y="11" width="10" height="27" rx="5"/>
    <rect x="59.5" y="19" width="10" height="19" rx="5"/>
  </g>
  <!-- 打开的书：两页向左上 / 右上展开，中缝为底色 -->
  <g fill="#ffffff">
    <path d="M16 48 L47 55 L47 84 L16 77 Z"/>
    <path d="M53 55 L84 48 L84 77 L53 84 Z"/>
  </g>
</svg>
